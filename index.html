<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計簿</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <main class="container">
        <h1>家計簿</h1>
        <form id="expenseForm">
            <div class="form-group">
                <label for="amount">金額</label>
                <div class="amount-input">
                    <select id="type" name="type">
                        <option value="expense" selected>− 支出</option>
                        <option value="income">＋ 収入</option>
                        <option value="charge">± チャージ</option>
                    </select>
                    <input type="text" id="amount" name="amount" inputmode="numeric" pattern="[0-9]*" min="1" required>
                </div>
            </div>

            <div class="form-group">
                <label for="payment">支払方法</label>
                <select id="payment" name="payment" required>
                    <option value="PayPay">PayPay</option>
                    <option value="現金">現金</option>
                    <option value="クレジットカード">クレジットカード</option>
                    <option value="Suica">Suica</option>
                    <option value="銀行">銀行</option>
                    <option value="その他">その他</option>
                </select>
            </div>

            <div class="form-group" id="shopGroup">
                <label for="shop">店舗</label>
                <div class="shop-search">
                    <input type="text" id="shop" name="shop" placeholder="現在地から店舗を取得" required>
                    <button type="button" class="gps-button" id="gpsButton">📍 現在地</button>
                </div>
                <div class="shop-candidates" id="shopCandidates"></div>
                <div class="map-wrapper" id="mapWrapper">
                    <div id="shopMap"></div>
                    <button type="button" class="map-search-button" id="mapSearchButton">この位置で店舗を検索</button>
                </div>
            </div>

            <div class="form-group" id="categoryGroup">
                <label for="category">カテゴリ</label>
                <select id="category" name="category" required>
                    <option value="食費">食費</option>
                    <option value="教会">教会</option>
                    <option value="献金">献金</option>
                    <option value="日用品">日用品</option>
                    <option value="交通費">交通費</option>
                    <option value="交際費">交際費</option>
                    <option value="娯楽">娯楽</option>
                    <option value="衣服">衣服</option>
                    <option value="医療">医療</option>
                    <option value="通信費">通信費</option>
                    <option value="チャージ">チャージ</option>
                    <option value="その他">その他</option>
                </select>
            </div>

            <div class="form-group">
                <label for="memo">メモ</label>
                <input type="text" id="memo" name="memo" placeholder="備考">
            </div>

            <button type="submit" class="submit-button" id="submitButton">登録</button>
        </form>

        <div id="message" class="message"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
